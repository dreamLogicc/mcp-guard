name: Release

# Publishes to PyPI when a v* tag is pushed. Authentication is OIDC — PyPI's
# trusted publishing — so no API token is stored in this repository or on a
# laptop, and there is nothing to leak or rotate.
#
# One-time setup on PyPI, before the first tag:
#   Your projects → Publishing → Add a pending publisher
#     PyPI project name: mcp-guard
#     Owner:             dreamLogicc
#     Repository:        mcp-guard
#     Workflow name:     release.yml
#     Environment:       pypi
#
# Repeat it on test.pypi.org with environment `testpypi` to use the dry run:
#   Actions → Release → Run workflow → target: testpypi

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish
        type: choice
        options: [testpypi, pypi]
        default: testpypi

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # A version on PyPI can never be reused, so a tag that disagrees with the
      # packaged version has to stop here rather than after the upload.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          packaged=$(uv version --short)
          tagged=${GITHUB_REF_NAME#v}
          echo "packaged=$packaged  tagged=$tagged"
          test "$packaged" = "$tagged"

      # The tests also run in ci.yml, but a release must not depend on someone
      # having looked at that run.
      - name: Test
        run: |
          uv sync --all-groups
          uv run ruff check .
          uv run pytest

      - name: Build
        run: uv build

      - name: Check metadata
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v7
      - run: uv publish --publish-url https://test.pypi.org/legacy/ --trusted-publishing always

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || inputs.target == 'pypi'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v7
      - run: uv publish --trusted-publishing always
