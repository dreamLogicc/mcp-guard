[project]
name = "mcp-guard"
version = "0.1.0"
description = "An MCP gateway that fronts several MCP servers and verifies every tool call against a formal policy"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "gateway", "proxy", "security", "guardrail", "smt", "z3"]
authors = [{ name = "Sergey Gondin", email = "gondin02@gmail.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    "anyio>=4.9",
    "httpx2>=2.5.0",
    "mcp>=2.0.0",
    "mcp-types>=2.0.0",
    "pydantic>=2.12.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.31.1",
    "z3-solver>=4.13",
]

[project.urls]
Repository = "https://github.com/dreamLogicc/mcp-guard"

[project.scripts]
mcp-guard = "mcp_guard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_guard"]
artifacts = ["mcp_guard/py.typed"]

[tool.hatch.build.targets.sdist]
include = ["mcp_guard", "examples", "README.md", "LICENSE"]
