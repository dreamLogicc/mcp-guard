[project]
name = "mcp-guard"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.3",
    "mcp>=2.0.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "z3-solver>=5.0.0.0",
]

[project.scripts]
mcp-guard = "mcp_guard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_guard"]
